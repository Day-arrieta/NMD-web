# Keep exported links and their inline typography unchanged.
# https://docs.netlify.com/build/configure-builds/file-based-configuration/
[build.processing.html]
  pretty_urls = false

# Internal docs, unused scripts and unlinked Figma prototypes stay in the repo but are not published.
# They answer with the 404 page. Remove a line here if a page becomes part of the live site.
[[redirects]]
  from = "/CMS.md"
  to = "/404.html"
  status = 404
  force = true


<script>function fit(){
  var s=document.getElementById('stage');
  var w=document.documentElement.clientWidth,h=window.innerHeight;
  var rail=Math.max(40,Math.round(108*Math.min(1,w/1920)));
  if(window.parent!==window){
    try{var fixed=window.parent.document.getElementById('nmd-rail-fixed');if(fixed)rail=fixed.getBoundingClientRect().width;}catch(e){}
  }
  var k=Math.min((w-rail)/1812,h/1080);
  s.style.margin='0';
  s.style.transform='translateX('+(rail-108*k)+'px) scale('+k+')';
  document.querySelector('.wrap').style.height=h+'px';
  document.body.style.minHeight=h+'px';
}fit();addEventListener('resize',fit);

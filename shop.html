<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — NMD19®</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--fg:#fff;--muted:#8a8a8a;--line:#262626;--yellow:#FDDE36;--rail:88px;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* rail */
.rail{position:fixed;left:0;top:0;width:var(--rail);height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0;z-index:50}
.rail__menu{display:flex;flex-direction:column;gap:6px;width:26px;cursor:pointer}
.rail__menu span{height:2px;background:#111;width:100%}
.rail__cart{position:relative}
.rail__count{position:absolute;top:-10px;right:-12px;background:#111;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* layout */
.main{margin-left:var(--rail);min-height:100vh}
.submenu{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.submenu button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:18px;cursor:pointer;border-right:1px solid var(--line);transition:.2s}
.submenu button:last-child{border-right:none}
.submenu button.on,.submenu button:hover{color:#fff;background:#161616}
.head{padding:60px clamp(20px,5vw,70px) 10px}
.head h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(70px,16vw,200px);line-height:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:34px clamp(20px,3vw,48px);padding:30px clamp(20px,5vw,70px) 90px;align-items:end}
.card{cursor:pointer;display:block}
.card__img{aspect-ratio:1;background:#141414;overflow:hidden}
.card.tall .card__img{aspect-ratio:3/4}
.card__img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .card__img img{transform:scale(1.05)}
.card__row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px;gap:12px}
.card__row h3{font-size:19px;font-weight:600}
.card__row .sub{color:var(--muted);font-size:13px}
.card__price{font-size:14px;font-weight:600;white-space:nowrap;text-align:right}
.card__price .cur{display:block;color:var(--muted);font-size:11px}
footer{border-top:1px solid var(--line);padding:46px clamp(20px,5vw,70px);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer a:hover{color:#fff}
.foot-links a{margin-right:18px}
@media(max-width:680px){
  :root{--rail:0px}
  .rail{flex-direction:row;width:100%;height:62px;padding:0 20px;border-bottom:1px solid #ddd}
  .main{margin-top:62px}
  .head h1{font-size:clamp(64px,22vw,120px)}
}
</style>
</head>
<body>
<div class="main">
  <div class="submenu" id="submenu">
    <button class="on" data-cat="all">All</button>
    <button data-cat="apparel">Apparel</button>
    <button data-cat="accesories">Accesories</button>
    <button data-cat="giftcards">Giftcards</button>
  </div>
  <div class="head"><h1>Shop</h1></div>
  <div class="grid" id="grid"></div>
  <footer>
    <span>Nomad Studio S.A. de C.V. 2022. All Rights Reserved®</span>
    <span class="foot-links">
      <a href="exact-desktop-f-a-q.html">F.A.Q.</a>
      <a href="exact-desktop-studio-2.html">Home</a>
      <a href="appointments.html">Appointments</a>
    </span>
  </footer>
</div>

<script src="assets/js/catalog.js?v=0052"></script>
<script src="assets/js/commerce.js?v=0052"></script>
<script>
const grid = document.getElementById('grid');
function render(cat){
  const list = PRODUCTS.filter(p => cat==='all' || p.cat===cat);
  grid.innerHTML = list.map((p,i) => `
    <a class="card ${i%3===1?'tall':''}" href="product.html?id=${p.id}">
      <div class="card__img"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
      <div class="card__row">
        <div><h3>${p.name}</h3><div class="sub">${p.sub}</div></div>
        <div class="card__price">${money(p.price)}<span class="cur">MXN</span></div>
      </div>
    </a>`).join('');
}
document.getElementById('submenu').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#submenu button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.cat);
});
render('all');
</script>
</body>
</html>

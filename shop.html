<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — NMD19®</title>
<meta name="description" content="Apparel, accessories and gift cards from NMD19, a contemporary tattoo studio in Mexico City.">
<meta property="og:type" content="website"><meta property="og:site_name" content="NMD19®"><meta property="og:title" content="Shop — NMD19®"><meta property="og:description" content="Apparel, accessories and gift cards from NMD19, a contemporary tattoo studio in Mexico City."><meta name="twitter:card" content="summary">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="assets/js/device-route.js?v=a60d8c88"></script>
<script src="assets/js/scroll-reveal.js?v=503d593f" defer></script>
<style>
:root{--bg:#0c0c0c;--fg:#fff;--muted:#8a8a8a;--line:#262626;--yellow:#FDDE36;--rail:88px;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Radio Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* rail */
.rail{position:fixed;left:0;top:0;width:var(--rail);height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0;z-index:50}
.rail__menu{display:flex;flex-direction:column;gap:6px;width:26px;cursor:pointer}
.rail__menu span{height:2px;background:#111;width:100%}
.rail__cart{position:relative}
.rail__count{position:absolute;top:-10px;right:-12px;background:#111;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* layout */
.main{margin-left:var(--rail);min-height:100vh}
.submenu{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.submenu button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:18px;cursor:pointer;border-right:1px solid var(--line);transition:.2s}
.submenu button:last-child{border-right:none}
.submenu button.on,.submenu button:hover{color:#fff;background:#161616}
.head{padding:60px clamp(20px,5vw,70px) 10px}
.head h1{font-family:'Manuka',sans-serif;text-transform:uppercase;font-size:clamp(70px,16vw,200px);line-height:.85;letter-spacing:0.03em;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:34px clamp(20px,3vw,48px);padding:30px clamp(20px,5vw,70px) 90px;align-items:end}
.card{cursor:pointer;display:block}
.card__img{aspect-ratio:1;background:#141414;overflow:hidden}
.card.tall .card__img{aspect-ratio:3/4}
.card__img img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.card:hover .card__img img{transform:scale(1.05)}
.card__row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px;gap:12px}
.card__row h3{font-size:19px;font-weight:400}
.card__row .sub{color:var(--muted);font-size:13px}
.card__price{font-size:14px;font-weight:400;white-space:nowrap;text-align:right}
.card__price .cur{display:block;color:var(--muted);font-size:11px}
footer{border-top:1px solid var(--line);padding:46px clamp(20px,5vw,70px);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer a:hover{color:#fff}
.foot-links a{margin-right:18px}
@media(max-width:680px){
  :root{--rail:0px}
  .rail{flex-direction:row;width:100%;height:62px;padding:0 20px;border-bottom:1px solid #ddd}
  .main{margin-top:62px}
  .head h1{font-size:clamp(64px,22vw,120px)}
  /* the category tabs don't fit one row on phones: scroll them inside the bar
     instead of widening the page */
  .submenu{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .submenu::-webkit-scrollbar{display:none}
  .submenu button{flex:1 0 auto;white-space:nowrap;padding:18px 14px}
  /* Teléfonos de 375–400px: las 4 categorías caben sin cortar "Giftcards" */
  @media (max-width:400px){.submenu button{padding:18px 10px;letter-spacing:.05em}}
}
/* Estados del catálogo y productos agotados */
.shop-msg{grid-column:1/-1;padding:40px 0;color:var(--muted,#8a8a8a);font-size:18px}
.shop-retry{margin-left:8px;background:none;border:1px solid currentColor;color:#fff;border-radius:100px;padding:8px 16px;font:inherit;cursor:pointer}
.card__img{position:relative}
.card__badge{position:absolute;left:12px;top:12px;background:#000;color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:100px}
.card.soldout img{opacity:.55}
</style>
<link rel="preload" href="assets/fonts/manuka-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/PPRadioGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css?v=ad9a13ed">
<link rel="stylesheet" href="assets/css/typography.css?v=877c1af5">
</head>
<body class="page-shop">
<div class="main">
  <div class="submenu" id="submenu" role="group" aria-label="Product categories">
    <button type="button" class="on" data-cat="all" aria-pressed="true">All</button>
    <button type="button" data-cat="apparel" aria-pressed="false">Apparel</button>
    <button type="button" data-cat="accessories" aria-pressed="false">Accessories</button>
    <button type="button" data-cat="giftcards" aria-pressed="false">Giftcards</button>
  </div>
  <div class="head"><h1>Shop</h1></div>
  <div class="grid" id="grid"></div>
  <footer>
    <span>© 2026 Nomad Studio S.A. de C.V. All rights reserved.</span>
    <span class="foot-links">
      <a href="exact-desktop-f-a-q.html#faq">F.A.Q.</a>
      <a href="exact-desktop-studio-2.html">Home</a>
      <a href="appointments.html">Appointments</a>
    </span>
  </footer>
</div>

<script src="assets/js/shop-config.js?v=4b79bf26"></script>
<script src="assets/js/shopify.js?v=55e51fbc"></script>
<script src="assets/js/catalog.js?v=2a1092bc"></script>
<script src="assets/js/commerce.js?v=8ffeb7ae"></script>
<script>
const grid = document.getElementById('grid');
let current = 'all';
function render(cat){
  current = cat;
  // Con Shopify, hasta que llegue su catálogo (o si falló) se deja el aviso de carga o de error:
  // nunca se muestran los productos de muestra. loadShop() dibuja la categoría elegida al terminar.
  if (Catalog.usesShopify() && Catalog.source !== 'shopify') return;
  const list = PRODUCTS.filter(p => cat==='all' || p.cat===cat);
  if (!list.length) { grid.innerHTML = '<p class="shop-msg">No products in this category yet.</p>'; return; }
  grid.innerHTML = list.map((p,i) => `
    <a class="card ${i%3===1?'tall':''}${p.available===false?' soldout':''}" href="product.html?id=${encodeURIComponent(p.id)}">
      <div class="card__img"><img src="${esc(p.thumb || p.img)}" alt="${esc(p.name)}" loading="lazy">${p.available===false?'<span class="card__badge">Sold out</span>':''}</div>
      <div class="card__row">
        <div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.sub)}</div></div>
        <div class="card__price">${p.prices && !p.giftcard ? 'From ' : ''}${money(p.price)}<span class="cur">MXN</span></div>
      </div>
    </a>`).join('');
}
// Catálogo local o de Shopify (shop-config.js). Si Shopify no responde, aviso + reintento (nunca productos de muestra).
function loadShop(){
  grid.innerHTML = '<p class="shop-msg" role="status">Loading products…</p>';
  Catalog.load().then(() => render(current)).catch(() => {
    grid.innerHTML = '<p class="shop-msg" role="alert">We couldn\'t load the shop right now. <button type="button" class="shop-retry">Try again</button></p>';
    grid.querySelector('.shop-retry').onclick = loadShop;
  });
}
document.getElementById('submenu').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#submenu button').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
  b.classList.add('on'); b.setAttribute('aria-pressed','true'); render(b.dataset.cat);
  b.scrollIntoView({ block:'nearest', inline:'nearest' });   // phones: bring a half-hidden tab fully into the bar
});
loadShop();
</script>
<script src="assets/js/sticky-rail.js?v=46e33a32"></script>
</body>
</html>

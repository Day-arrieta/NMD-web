<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cart — NMD19®</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--fg:#fff;--muted:#8a8a8a;--line:#262626;--yellow:#FDDE36;--rail:88px;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;width:var(--rail);height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0;z-index:50}
.rail__menu{display:flex;flex-direction:column;gap:6px;width:26px;cursor:pointer}.rail__menu span{height:2px;background:#111;width:100%}
.rail__cart{position:relative}.rail__count{position:absolute;top:-10px;right:-12px;background:#111;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.main{margin-left:var(--rail);min-height:100vh}
.wrap{display:grid;grid-template-columns:1.5fr .9fr;gap:clamp(24px,4vw,64px);padding:60px clamp(20px,4vw,60px) 80px;align-items:start}
h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(56px,9vw,120px);line-height:.85;margin-bottom:28px}
.item{display:grid;grid-template-columns:104px 1fr auto;gap:22px;padding:24px 0;border-bottom:1px solid var(--line)}
.item img{width:104px;height:130px;object-fit:cover;background:#fff}
.item h3{font-size:21px;font-weight:600}.item .sub,.item .sz{color:var(--muted);font-size:13px;margin-top:2px}
.iq{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:100px;margin-top:14px}
.iq button{background:none;border:none;color:#fff;padding:6px 14px;cursor:pointer;font-size:16px}.iq span{min-width:30px;text-align:center;font-weight:600}
.item-right{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.rm{color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}
.summary{position:sticky;top:30px;background:#fff;color:#000;border-radius:16px;padding:32px}
.summary h2{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:38px;margin-bottom:22px}
.row{display:flex;justify-content:space-between;padding:11px 0;font-size:16px;color:#444}
.row .cur{font-size:11px;color:#999;margin-left:5px}
.row.total{border-top:1px solid #ddd;margin-top:8px;padding-top:18px;color:#000;font-size:22px;font-weight:700}
.checkout{width:100%;margin-top:22px;background:#000;color:#fff;border:none;border-radius:100px;padding:18px;font-family:inherit;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:15px;cursor:pointer;transition:.2s var(--ease)}
.checkout:hover{background:var(--yellow);color:#000}
.summary .small{font-size:12px;color:#999;text-align:center;margin-top:12px}
.empty{padding:120px clamp(20px,5vw,60px);text-align:left}
.empty h1{margin-bottom:14px}.empty p{color:var(--muted);margin-bottom:28px}
.empty a{display:inline-block;border:1.5px solid #fff;border-radius:100px;padding:15px 30px;text-transform:uppercase;font-size:14px;font-weight:600}
.empty a:hover{background:#fff;color:#000}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:680px){:root{--rail:0px}.rail{flex-direction:row;width:100%;height:62px;padding:0 20px}.main{margin-top:62px}}
</style>
</head>
<body>
<div class="main" id="root"></div>

<script src="assets/js/catalog.js?v=0052"></script>
<script src="assets/js/commerce.js?v=0052"></script>
<script>
const root = document.getElementById('root');
function render(){
  const items = Cart.read();
  if(!items.length){
    root.innerHTML = `<section class="empty"><h1>Cart<br>Empty</h1><p>You haven't added anything yet.</p><a href="shop.html">Go to Shop</a></section>`;
    return;
  }
  const sub = Cart.subtotal();
  const discount = Math.round(sub*0.10);
  const total = sub - discount;
  root.innerHTML = `
  <section class="wrap">
    <div>
      <h1>My Cart</h1>
      <div id="items">${items.map(i=>`
        <div class="item">
          <img src="${i.img}" alt="${i.name}">
          <div>
            <h3>${i.name}</h3><div class="sub">${i.sub||''}</div><div class="sz">Size: ${i.size}</div>
            <div class="iq"><button data-act="minus" data-id="${i.id}" data-size="${i.size}">–</button><span>${i.qty}</span><button data-act="plus" data-id="${i.id}" data-size="${i.size}">+</button></div>
          </div>
          <div class="item-right">
            <strong>${money(i.price*i.qty)} <span style="font-size:11px;color:var(--muted)">MXN</span></strong>
            <button class="rm" data-act="remove" data-id="${i.id}" data-size="${i.size}">Remove</button>
          </div>
        </div>`).join('')}</div>
    </div>
    <aside class="summary">
      <h2>Summary</h2>
      <div class="row"><span>Subtotal</span><span>${money(sub)}<span class="cur">MXN</span></span></div>
      <div class="row"><span>Discount (10%)</span><span>-${money(discount)}<span class="cur">MXN</span></span></div>
      <div class="row total"><span>Total</span><span>${money(total)}<span class="cur">MXN</span></span></div>
      <button class="checkout" id="checkout">Checkout Now</button>
      <p class="small">Pago seguro vía Shopify (se conecta al publicar la tienda).</p>
    </aside>
  </section>`;
  document.getElementById('items').addEventListener('click', e=>{
    const b = e.target.closest('[data-act]'); if(!b) return;
    const { act, id, size } = b.dataset;
    const it = Cart.read().find(i=>i.id===id && i.size===size);
    if(act==='minus') Cart.setQty(id,size,it.qty-1);
    if(act==='plus') Cart.setQty(id,size,it.qty+1);
    if(act==='remove') Cart.remove(id,size);
    render();
  });
  document.getElementById('checkout').onclick = checkout;
}

/* checkout() y SHOPIFY_DOMAIN los provee commerce.js (declararlos aquí otra vez
   causaba "Identifier 'SHOPIFY_DOMAIN' has already been declared" y rompía el render). */
render();
</script>
</body>
</html>

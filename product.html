<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — NMD19®</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--fg:#fff;--muted:#8a8a8a;--line:#262626;--yellow:#FDDE36;--rail:88px;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.rail{position:fixed;left:0;top:0;width:var(--rail);height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0;z-index:50}
.rail__menu{display:flex;flex-direction:column;gap:6px;width:26px;cursor:pointer}.rail__menu span{height:2px;background:#111;width:100%}
.rail__cart{position:relative}.rail__count{position:absolute;top:-10px;right:-12px;background:#111;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.main{margin-left:var(--rail)}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,64px);padding:70px clamp(20px,4vw,60px) 40px;align-items:start}
.gallery{position:sticky;top:30px;display:flex;flex-direction:column;gap:14px}
.gallery__main{aspect-ratio:4/5;background:#fff;overflow:hidden}
.gallery__main img{width:100%;height:100%;object-fit:cover}
.gallery__thumbs{display:flex;gap:12px;flex-wrap:wrap}
.gallery__thumbs img{width:78px;height:96px;object-fit:cover;cursor:pointer;opacity:.5;background:#fff;transition:.2s}
.gallery__thumbs img.on,.gallery__thumbs img:hover{opacity:1}
.info .sku{color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.info h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(52px,7vw,118px);line-height:.85;margin:6px 0 14px}
.info .price{font-size:24px;font-weight:600;margin-bottom:34px}
.info .price .cur{font-size:13px;color:var(--muted);margin-left:6px}
.label{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:12px}
.label a{color:var(--muted);font-size:13px;text-decoration:underline}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.sizes button{min-width:52px;padding:13px 16px;background:none;border:1.5px solid var(--line);color:#fff;border-radius:9px;font-family:inherit;font-weight:600;cursor:pointer;transition:.2s}
.sizes button.on,.sizes button:hover{border-color:var(--yellow);background:var(--yellow);color:#000}
.buy{display:flex;gap:14px;align-items:stretch;margin-bottom:36px}
.qty{display:inline-flex;align-items:center;border:1.5px solid #fff;border-radius:100px;overflow:hidden}
.qty button{background:none;border:none;color:#fff;font-size:18px;padding:0 18px;cursor:pointer}
.qty span{min-width:36px;text-align:center;font-weight:600}
.add{flex:1;background:#fff;color:#000;border:none;border-radius:100px;font-family:inherit;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;cursor:pointer;transition:.2s var(--ease)}
.add:hover{background:var(--yellow)}
.note{color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:13px;line-height:1.7;margin-bottom:30px}
.pinfo h2{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(30px,4vw,46px);border-top:1px solid var(--line);padding-top:24px;margin-bottom:14px}
.pinfo li{list-style:none;padding:9px 0;border-bottom:1px dashed var(--line);color:#cfcfcf;font-size:15px}
.back{display:inline-block;margin-top:28px;border:1.5px solid #fff;border-radius:100px;padding:13px 26px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.back:hover{background:#fff;color:#000}
.reco{padding:30px clamp(20px,4vw,60px) 90px}
.reco h2{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(30px,5vw,64px);line-height:.85;margin-bottom:30px}
.reco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.reco-card__img{aspect-ratio:1;background:#141414;overflow:hidden}
.reco-card__img img{width:100%;height:100%;object-fit:cover;transition:.5s var(--ease)}
.reco-card:hover .reco-card__img img{transform:scale(1.05)}
.reco-card h3{font-size:17px;font-weight:600;margin-top:12px}.reco-card .sub{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(18px);background:var(--yellow);color:#000;font-weight:700;padding:14px 28px;border-radius:100px;opacity:0;transition:.3s var(--ease);z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.pdp{grid-template-columns:1fr}.gallery{position:static}}
@media(max-width:680px){:root{--rail:0px}.rail{flex-direction:row;width:100%;height:62px;padding:0 20px}.main{margin-top:62px}}
</style>
</head>
<body>
<div class="main">
  <div class="pdp">
    <div class="gallery">
      <div class="gallery__main"><img id="mainImg" src="" alt=""></div>
      <div class="gallery__thumbs" id="thumbs"></div>
    </div>
    <div class="info">
      <p class="sku" id="sku"></p>
      <h1 id="name"></h1>
      <p class="price"><span id="price"></span><span class="cur">MXN</span></p>
      <div class="label"><span>Select a Size:</span><a href="#">Sizeguide</a></div>
      <div class="sizes" id="sizes"></div>
      <div class="buy">
        <div class="qty"><button id="minus">–</button><span id="qty">1</span><button id="plus">+</button></div>
        <button class="add" id="add">Add to Cart</button>
      </div>
      <p class="note" id="note"></p>
      <div class="pinfo"><h2>Product Info</h2><ul id="info"></ul></div>
      <a class="back" href="shop.html">← Return to Shop</a>
    </div>
  </div>
  <div class="reco">
    <h2>Recommended<br>Pickups</h2>
    <div class="reco-grid" id="reco"></div>
  </div>
</div>
<div class="toast" id="toast">Added to cart ✓</div>

<script src="assets/js/catalog.js?v=0052"></script>
<script src="assets/js/commerce.js?v=0052"></script>
<script>
const P = findProduct(new URLSearchParams(location.search).get('id'));
let size = P.sizes[0], qty = 1;
document.getElementById('sku').textContent = P.sku || '';
document.getElementById('name').textContent = P.name + (P.sub?(' '+P.sub):'');
document.getElementById('price').textContent = money(P.price);
document.getElementById('note').textContent = P.note || '';
document.getElementById('info').innerHTML = P.info.map(i=>`<li>${i}</li>`).join('');
const mainImg = document.getElementById('mainImg'); mainImg.src = P.gallery[0]; mainImg.alt = P.name;
document.getElementById('thumbs').innerHTML = P.gallery.map((g,i)=>`<img src="${g}" class="${i===0?'on':''}" alt="">`).join('');
document.getElementById('thumbs').onclick = e => { if(e.target.tagName!=='IMG') return; mainImg.src=e.target.src; document.querySelectorAll('#thumbs img').forEach(t=>t.classList.remove('on')); e.target.classList.add('on'); };
const sizesEl = document.getElementById('sizes');
sizesEl.innerHTML = P.sizes.map((s,i)=>`<button class="${i===0?'on':''}">${s}</button>`).join('');
sizesEl.onclick = e => { const b=e.target.closest('button'); if(!b) return; document.querySelectorAll('#sizes button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); size=b.textContent; };
const qtyEl = document.getElementById('qty');
document.getElementById('minus').onclick = ()=>{ qty=Math.max(1,qty-1); qtyEl.textContent=qty; };
document.getElementById('plus').onclick = ()=>{ qty++; qtyEl.textContent=qty; };
document.getElementById('add').onclick = ()=>{
  Cart.add({ id:P.id, name:P.name, sub:P.sub, price:P.price, img:P.img, size, qty });
  if(typeof openCart==='function') openCart();           // abre el drawer (como el Figma)
  else { const t=document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
};
document.getElementById('reco').innerHTML = PRODUCTS.filter(p=>p.id!==P.id).slice(0,4).map(p=>`
  <a class="reco-card" href="product.html?id=${p.id}">
    <div class="reco-card__img"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
    <h3>${p.name}</h3><div class="sub">${p.sub} · ${money(p.price)} MXN</div></a>`).join('');
</script>
</body>
</html>
